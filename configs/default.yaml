seed: 42
data:
  path: data/raw/ETTh1.csv
  target: OT
  input_len: 96
  horizons: [24, 48, 96]
  split_ratios: [0.7, 0.1, 0.2]
  max_train_windows: null
  max_eval_windows: null
model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 128
  dropout: 0.1
  positional_encoding: sinusoidal
training:
  batch_size: 64
  epochs: 12
  patience: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
baselines:
  arima_order: [2, 0, 1]
  sarima_seasonal_order: [1, 0, 0, 24]
  arima_history: 720
  xgboost_estimators: 200
  xgboost_max_depth: 5
  xgboost_learning_rate: 0.05
  mlp_hidden: [128, 64]
output_dir: results

